<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>علی منصوری | FORESIGHT HUB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Vazirmatn:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20260723o">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script>window.SFH_LOCALE_VERSION = '62';</script>
</head>
<body class="sfh-platform home-page">
    <canvas id="particles-canvas"></canvas>

    <header class="main-header">
        <div class="logo">
            <span class="logo-icon"><i data-lucide="terminal"></i></span>
            <span class="logo-text">FORESIGHT <span class="highlight">HUB</span></span>
        </div>
        <nav class="nav-links"></nav>
        <div class="header-actions">
            <a href="mailto:ali.mansouri1998@gmail.com" class="btn-primary-sm header-mail-cta">
                <i data-lucide="mail"></i>
                <span data-i18n="index.mailCta">ارتباط مستقیم</span>
            </a>
        </div>
    </header>

    <main id="main-content" class="home-landing">
        <section class="home-hero home-hero--landing">
            <div class="home-hero-glow" aria-hidden="true"></div>
            <div class="home-hero-inner container">
                <div class="home-hero-content home-hero-content--landing">
                    <div class="home-hero-badge">
                        <span class="home-hero-badge-dot" aria-hidden="true"></span>
                        <span data-i18n="index.badge">معماری سیستم + آینده‌پژوهی راهبردی</span>
                    </div>

                    <h1 class="home-hero-title">
                        <span data-i18n="index.heroTitleHtml" data-i18n-html></span>
                    </h1>

                    <p class="home-hero-bridge" data-i18n="index.heroBridge"></p>

                    <div class="home-hero-credentials">
                        <div class="home-credential-pill">
                            <i data-lucide="graduation-cap"></i>
                            <span data-i18n="index.credentialPhd"></span>
                        </div>
                        <div class="home-credential-pill">
                            <i data-lucide="building-2"></i>
                            <span data-i18n="index.credentialSnapp"></span>
                        </div>
                    </div>

                    <div class="home-hero-actions">
                        <a href="#contact" class="btn-primary-sm home-cta-primary">
                            <span data-i18n="index.ctaCollab">دعوت برای تدریس / مشاوره</span>
                            <i data-lucide="arrow-up-right"></i>
                        </a>
                        <a href="methods/" class="btn-ghost-sm">
                            <span data-i18n="index.ctaMethods">روش‌های آینده‌پژوهی</span>
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <section class="container home-why-section">
            <h2 class="home-section-title" data-i18n="brand.whyTitle">چرا FORESIGHT HUB؟</h2>
            <div id="home-why-grid" class="home-why-grid"></div>
        </section>

        <section class="container home-timeline-section">
            <h2 class="home-section-title" data-i18n="brand.pathTitle">مسیر تکامل فکری</h2>
            <div id="home-timeline" class="home-timeline"></div>
        </section>

        <section id="contact" class="container home-collab-section">
            <div class="home-collab-card">
                <h2 class="home-collab-title" data-i18n="brand.collabTitle">فرصت‌های همکاری و تدریس</h2>
                <p class="home-collab-desc" data-i18n="brand.collabDesc"></p>
                <a class="home-collab-email btn-primary-sm" href="mailto:ali.mansouri1998@gmail.com">
                    <i data-lucide="mail"></i>
                    <span data-i18n="index.contactEmailCta">ارسال ایمیل برای هماهنگی و گفت‌وگو</span>
                </a>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="footer-container container compact">
            <div class="footer-info">
                <div class="footer-logo">
                    <span class="logo-icon"><i data-lucide="terminal"></i></span>
                    <span class="logo-text">FORESIGHT <span class="highlight">HUB</span></span>
                </div>
                <p data-i18n="footer.desc"></p>
            </div>
        </div>
        <div class="footer-bottom">
            <p data-i18n="footer.copyright"></p>
        </div>
    </footer>

    <script src="js/core/paths.js?v=16"></script>
    <script src="js/core/i18n.js?v=16"></script>
    <script src="js/core/load-locales.js?v=16"></script>
    <script src="js/core/i18n-render.js?v=16"></script>
    <script src="js/core/shared.js?v=16"></script>
    <script src="js/core/animation.js?v=16"></script>
    <script src="js/core/main.js?v=16"></script>
</body>
</html>
