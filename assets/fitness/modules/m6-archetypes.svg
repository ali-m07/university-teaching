  <text x="270" y="230" text-anchor="middle" fill="#f3f4f6" font-size="13">Nvidia · Netflix · Microsoft</text>
  <rect x="500" y="110" width="380" height="170" rx="14" fill="#152035" stroke="#7c4dff" stroke-width="2"/>
  <text x="690" y="165" text-anchor="middle" fill="#7c4dff" font-size="20" font-weight="700">Neurotic</text>
