  <text x="480" y="52" text-anchor="middle" fill="#f3f4f6" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Four Archetypes</text>
  
  <rect x="80" y="110" width="380" height="170" rx="14" fill="#102030" stroke="#00e5ff" stroke-width="2"/>
