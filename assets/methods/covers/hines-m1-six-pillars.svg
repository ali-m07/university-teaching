<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="540">
      <stop stop-color="#070a13"/><stop offset="1" stop-color="#0f1729"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00e5ff"/><stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b9bb0"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)" rx="18"/>
  <text x="480" y="52" text-anchor="middle" fill="#f3f4f6" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">Six Pillars · Frame to Act</text>
  
  
  <rect x="82" y="220" width="136" height="100" rx="12" fill="#152035" stroke="#00e5ff" stroke-width="2"/>
  <text x="150" y="260" text-anchor="middle" fill="#00e5ff" font-size="14" font-weight="700">1. Framing</text>
  <text x="150" y="282" text-anchor="middle" fill="#8b9bb0" font-size="10">pillar 1</text>
  <path d="M218 270 H232" stroke="#8b9bb0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="232" y="220" width="136" height="100" rx="12" fill="#152035" stroke="#4caf50" stroke-width="2"/>
  <text x="300" y="260" text-anchor="middle" fill="#4caf50" font-size="14" font-weight="700">2. Scanning</text>
  <text x="300" y="282" text-anchor="middle" fill="#8b9bb0" font-size="10">pillar 2</text>
  <path d="M368 270 H382" stroke="#8b9bb0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="382" y="220" width="136" height="100" rx="12" fill="#152035" stroke="#ffaa00" stroke-width="2"/>
  <text x="450" y="260" text-anchor="middle" fill="#ffaa00" font-size="14" font-weight="700">3. Forecasting</text>
  <text x="450" y="282" text-anchor="middle" fill="#8b9bb0" font-size="10">pillar 3</text>
  <path d="M518 270 H532" stroke="#8b9bb0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="532" y="220" width="136" height="100" rx="12" fill="#152035" stroke="#7c4dff" stroke-width="2"/>
  <text x="600" y="260" text-anchor="middle" fill="#7c4dff" font-size="14" font-weight="700">4. Visioning</text>
  <text x="600" y="282" text-anchor="middle" fill="#8b9bb0" font-size="10">pillar 4</text>
  <path d="M668 270 H682" stroke="#8b9bb0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="682" y="220" width="136" height="100" rx="12" fill="#152035" stroke="#ff5a7a" stroke-width="2"/>
  <text x="750" y="260" text-anchor="middle" fill="#ff5a7a" font-size="14" font-weight="700">5. Planning</text>
  <text x="750" y="282" text-anchor="middle" fill="#8b9bb0" font-size="10">pillar 5</text>
  <path d="M818 270 H832" stroke="#8b9bb0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="832" y="220" width="136" height="100" rx="12" fill="#152035" stroke="#f3f4f6" stroke-width="2"/>
  <text x="900" y="260" text-anchor="middle" fill="#f3f4f6" font-size="14" font-weight="700">6. Acting</text>
  <text x="900" y="282" text-anchor="middle" fill="#8b9bb0" font-size="10">pillar 6</text>
  
  <text x="480" y="400" text-anchor="middle" fill="#8b9bb0" font-size="14">A path, not a toolbox: weakness in one pillar breaks the whole chain.</text>

  <text x="480" y="516" text-anchor="middle" fill="#8b9bb0" font-family="Segoe UI,Arial,sans-serif" font-size="14">Hines &amp; Bishop (2006) · Module M1</text>
</svg>