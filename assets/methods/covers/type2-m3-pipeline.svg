<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="540">
      <stop stop-color="#070a13"/><stop offset="1" stop-color="#0f1729"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00e5ff"/><stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b9bb0"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)" rx="18"/>
  <text x="480" y="52" text-anchor="middle" fill="#f3f4f6" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">Fuzzy System · Rule Base &amp; Type-Reduction</text>
  
  
  <rect x="60" y="200" width="160" height="140" rx="14" fill="#152035" stroke="#00e5ff" stroke-width="2"/>
  <text x="140" y="260" text-anchor="middle" fill="#00e5ff" font-size="16" font-weight="700">Fuzzify</text>
  <text x="140" y="285" text-anchor="middle" fill="#8b9bb0" font-size="11">crisp → fuzzy</text>
  <path d="M220 270 H280" stroke="#8b9bb0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="260" y="200" width="160" height="140" rx="14" fill="#152035" stroke="#7c4dff" stroke-width="2"/>
  <text x="340" y="260" text-anchor="middle" fill="#7c4dff" font-size="16" font-weight="700">Rule base</text>
  <text x="340" y="285" text-anchor="middle" fill="#8b9bb0" font-size="11">Mamdani IF-THEN</text>
  <path d="M420 270 H480" stroke="#8b9bb0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="460" y="200" width="160" height="140" rx="14" fill="#152035" stroke="#ffaa00" stroke-width="2"/>
  <text x="540" y="260" text-anchor="middle" fill="#ffaa00" font-size="16" font-weight="700">Type-reduce</text>
  <text x="540" y="285" text-anchor="middle" fill="#8b9bb0" font-size="11">IT2 → Type-1</text>
  <path d="M620 270 H680" stroke="#8b9bb0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="660" y="200" width="160" height="140" rx="14" fill="#152035" stroke="#4caf50" stroke-width="2"/>
  <text x="740" y="260" text-anchor="middle" fill="#4caf50" font-size="16" font-weight="700">Defuzzify</text>
  <text x="740" y="285" text-anchor="middle" fill="#8b9bb0" font-size="11">fuzzy → crisp</text>
  
  <text x="480" y="410" text-anchor="middle" fill="#8b9bb0" font-size="14">Type-reduction is the extra step IT2 adds before ordinary defuzzification.</text>

  <text x="480" y="516" text-anchor="middle" fill="#8b9bb0" font-family="Segoe UI,Arial,sans-serif" font-size="14">Data path through the system · Module M3</text>
