<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="540">
      <stop stop-color="#070a13"/><stop offset="1" stop-color="#0f1729"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00e5ff"/><stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b9bb0"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)" rx="18"/>
  <text x="480" y="52" text-anchor="middle" fill="#f3f4f6" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">From Alternative Metaphor to Scenario</text>
  
  <circle cx="200" cy="270" r="90" fill="#152035" stroke="#ff5a7a" stroke-width="2"/>
  <text x="200" y="260" text-anchor="middle" fill="#ff5a7a" font-size="16" font-weight="700">Old myth</text>
  <text x="200" y="285" text-anchor="middle" fill="#8b9bb0" font-size="12">"machine knows best"</text>
  <path d="M300 270 H400" stroke="url(#accent)" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="500" cy="270" r="90" fill="#102030" stroke="#00e5ff" stroke-width="2"/>
  <text x="500" y="260" text-anchor="middle" fill="#00e5ff" font-size="16" font-weight="700">New metaphor</text>
  <text x="500" y="285" text-anchor="middle" fill="#8b9bb0" font-size="12">"co-worker in the loop"</text>
  <path d="M600 270 H700" stroke="url(#accent)" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="710" y="200" width="180" height="140" rx="14" fill="#152035" stroke="#7c4dff" stroke-width="2"/>
  <text x="800" y="255" text-anchor="middle" fill="#7c4dff" font-size="16" font-weight="700">Scenario</text>
  <text x="800" y="280" text-anchor="middle" fill="#8b9bb0" font-size="12">and Futures Wheel</text>
  <text x="480" y="410" text-anchor="middle" fill="#8b9bb0" font-size="14">A good metaphor changes what looks possible, not just what is said.</text>

  <text x="480" y="516" text-anchor="middle" fill="#8b9bb0" font-family="Segoe UI,Arial,sans-serif" font-size="14">Bridge to Wheel &amp; scenarios · Module M3</text>
</svg>