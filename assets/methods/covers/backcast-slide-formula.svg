<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">فرمول‌بندی عددی هدف انتشار</title><desc id="desc">سال پایه، قید انتشار، معادلهٔ انتشار و محاسبهٔ مقدار برق پاک در یک مثال آموزشی.</desc>
<rect width="960" height="540" fill="#fff"/><text x="480" y="55" text-anchor="middle" font-family="Vazirmatn,Tahoma,sans-serif" font-size="29" font-weight="800" fill="#202a30">هدف را به قید قابل محاسبه تبدیل کنیم</text><text x="480" y="85" text-anchor="middle" font-family="Vazirmatn,Tahoma,sans-serif" font-size="16" fill="#65717a">مثال آموزشی برق شهری؛ اعداد واقعی شهر نیستند</text>
<g font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle"><rect x="35" y="130" width="273" height="280" rx="22" fill="#e43b54"/><text x="171" y="185" fill="white" font-size="22" font-weight="800">۱. سال پایه و هدف</text><text x="171" y="241" fill="white" font-size="20">E₀ = ۵۰۰ هزار تن</text><text x="171" y="283" fill="white" font-size="19">کاهش هدف: ۶۰٪</text><text x="171" y="342" fill="white" font-size="22" font-weight="800">E₁₄₁₀ ≤ ۲۰۰ هزار تن</text>
<rect x="343" y="130" width="273" height="280" rx="22" fill="#f4aa12"/><text x="479" y="185" fill="white" font-size="22" font-weight="800">۲. معادلهٔ ساده</text><text x="479" y="241" fill="white" font-size="23">E = g × F</text><text x="479" y="283" fill="white" font-size="19">g = ۰٫۵ تن / مگاوات‌ساعت</text><text x="479" y="342" fill="white" font-size="22" font-weight="800">F ≤ ۴۰۰ گیگاوات‌ساعت</text>
<rect x="651" y="130" width="273" height="280" rx="22" fill="#079b7a"/><text x="787" y="185" fill="white" font-size="22" font-weight="800">۳. نیاز تأمین پاک</text><text x="787" y="241" fill="white" font-size="19">تقاضا = ۱۰۰۰ گیگاوات‌ساعت</text><text x="787" y="283" fill="white" font-size="20">R = D − F</text><text x="787" y="342" fill="white" font-size="22" font-weight="800">R ≥ ۶۰۰ گیگاوات‌ساعت</text></g>
<text x="480" y="468" text-anchor="middle" font-family="Vazirmatn,Tahoma,sans-serif" font-size="18" font-weight="700" fill="#36414a">قید هدف مسیر را تعیین نمی‌کند؛ چند راه برای رسیدن به آن باید مقایسه شود.</text>
<text x="480" y="505" text-anchor="middle" font-family="Vazirmatn,Tahoma,sans-serif" font-size="15" fill="#69747c">در کاربرد واقعی: تلفات شبکه، تغییر تقاضا، پایداری عرضه و هزینه را هم وارد مدل کنید.</text>
</svg>
