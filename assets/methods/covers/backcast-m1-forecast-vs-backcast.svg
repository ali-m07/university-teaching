<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="540">
      <stop stop-color="#070a13"/><stop offset="1" stop-color="#0f1729"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00e5ff"/><stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b9bb0"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)" rx="18"/>
  <text x="480" y="52" text-anchor="middle" fill="#f3f4f6" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">Forecasting vs. Backcasting</text>
  
  <circle cx="220" cy="270" r="18" fill="#8b9bb0"/>
  <text x="220" y="248" text-anchor="middle" fill="#8b9bb0" font-size="13">Today</text>
  <path d="M240 270 H700" stroke="#8b9bb0" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="470" y="255" text-anchor="middle" fill="#8b9bb0" font-size="14">Forecast: extend the present forward</text>
  <circle cx="720" cy="270" r="18" fill="#8b9bb0" fill-opacity="0.6"/>
  <text x="720" y="300" text-anchor="middle" fill="#8b9bb0" font-size="12">probable future</text>
  <circle cx="720" cy="400" r="22" fill="#102030" stroke="#00e5ff" stroke-width="3"/>
  <text x="720" y="440" text-anchor="middle" fill="#00e5ff" font-size="14" font-weight="700">Desired future</text>
  <path d="M700 400 H240" stroke="url(#accent)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="470" y="425" text-anchor="middle" fill="#00e5ff" font-size="14">Backcast: work backward from the vision</text>
  <circle cx="220" cy="400" r="18" fill="#00e5ff" fill-opacity="0.5"/>
  <text x="220" y="430" text-anchor="middle" fill="#00e5ff" font-size="12">today's first move</text>

  <text x="480" y="516" text-anchor="middle" fill="#8b9bb0" font-family="Segoe UI,Arial,sans-serif" font-size="14">Two planning paradigms · Module M1</text>
</svg>