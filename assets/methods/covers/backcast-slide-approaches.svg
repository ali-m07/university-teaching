<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">سه انتخاب در طراحی روش پس‌نگری</title><desc id="desc">سه کارت رنگی برای جهت پژوهش، مشارکت و شیوهٔ تحلیل.</desc>
<rect width="960" height="540" fill="#fff"/><text x="480" y="54" text-anchor="middle" font-family="Vazirmatn,Tahoma,sans-serif" font-size="29" font-weight="800" fill="#252a30">روش پس‌نگری را چگونه انتخاب کنیم؟</text><text x="480" y="84" text-anchor="middle" font-family="Vazirmatn,Tahoma,sans-serif" font-size="16" fill="#5c6570">سه پرسش مستقل برای طراحی یک پروژه</text>
<g font-family="Vazirmatn,Tahoma,sans-serif" direction="rtl" text-anchor="middle">
<rect x="36" y="126" width="278" height="344" rx="24" fill="#e23c55"/><rect x="36" y="450" width="278" height="20" rx="9" fill="#b91f3a"/><circle cx="175" cy="145" r="34" fill="#a91b38"/><text x="175" y="156" fill="white" font-size="26" font-weight="800">۱</text><text x="175" y="218" fill="white" font-size="24" font-weight="800">جهت پژوهش</text><path d="M92 240H258" stroke="white" stroke-width="3"/><text x="175" y="285" fill="white" font-size="19">هدف‌محور یا مسیرمحور؟</text><text x="175" y="325" fill="white" font-size="16">هدف ثابت را بیازماییم</text><text x="175" y="355" fill="white" font-size="16">یا چند راه را مقایسه کنیم</text>
<rect x="341" y="126" width="278" height="344" rx="24" fill="#f4ab12"/><rect x="341" y="450" width="278" height="20" rx="9" fill="#c48600"/><circle cx="480" cy="145" r="34" fill="#bd8000"/><text x="480" y="156" fill="white" font-size="26" font-weight="800">۲</text><text x="480" y="218" fill="white" font-size="24" font-weight="800">مشارکت</text><path d="M397 240H563" stroke="white" stroke-width="3"/><text x="480" y="285" fill="white" font-size="19">مشارکتی یا کارشناسی؟</text><text x="480" y="325" fill="white" font-size="16">چه کسانی هدف را می‌سازند؟</text><text x="480" y="355" fill="white" font-size="16">چه کسانی مسیر را نقد می‌کنند؟</text>
<rect x="646" y="126" width="278" height="344" rx="24" fill="#009f7d"/><rect x="646" y="450" width="278" height="20" rx="9" fill="#087e66"/><circle cx="785" cy="145" r="34" fill="#087a61"/><text x="785" y="156" fill="white" font-size="26" font-weight="800">۳</text><text x="785" y="218" fill="white" font-size="24" font-weight="800">شیوهٔ تحلیل</text><path d="M702 240H868" stroke="white" stroke-width="3"/><text x="785" y="285" fill="white" font-size="19">کیفی، کمی یا ترکیبی؟</text><text x="785" y="325" fill="white" font-size="16">روایت و گفت‌وگو</text><text x="785" y="355" fill="white" font-size="16">در کنار داده و مدل</text>
</g><text x="480" y="512" text-anchor="middle" font-family="Vazirmatn,Tahoma,sans-serif" font-size="15" fill="#49545e">این‌ها سه بُعد انتخاب روش‌اند؛ یک پروژه می‌تواند آن‌ها را ترکیب کند.</text>
</svg>
