<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">پیش‌بینی و پس‌نگری در یک مسئلهٔ برق شهری</title>
  <desc id="desc">مسیر خاکستری از امروز به آیندهٔ محتمل می‌رود؛ مسیر سبز از هدف سال ۱۴۱۰ به تصمیم امروز بازمی‌گردد.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09151c"/><stop offset="1" stop-color="#102a2c"/></linearGradient>
    <marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#a9b9c0"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#58e6ad"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".24"/></filter>
  </defs>
  <rect width="960" height="540" rx="24" fill="url(#bg)"/>
  <text x="480" y="55" text-anchor="middle" direction="rtl" font-family="Vazirmatn,Tahoma,sans-serif" font-size="27" font-weight="700" fill="#f2faf7">دو پرسش برای یک تصمیم شهری</text>
  <text x="480" y="83" text-anchor="middle" direction="rtl" font-family="Vazirmatn,Tahoma,sans-serif" font-size="15" fill="#b2c9c7">مثال: مصرف برق و هدف کاهش انتشار تا ۱۴۱۰</text>
  <rect x="72" y="118" width="816" height="150" rx="20" fill="#162a32" stroke="#526b74" filter="url(#shadow)"/>
  <rect x="72" y="289" width="816" height="172" rx="20" fill="#13392f" stroke="#4abf91" filter="url(#shadow)"/>
  <text x="836" y="157" text-anchor="end" direction="rtl" font-family="Vazirmatn,Tahoma,sans-serif" font-size="21" font-weight="700" fill="#dce8e9">پیش‌بینی</text>
  <text x="836" y="332" text-anchor="end" direction="rtl" font-family="Vazirmatn,Tahoma,sans-serif" font-size="21" font-weight="700" fill="#85f2be">پس‌نگری</text>
  <circle cx="205" cy="206" r="11" fill="#c3d3d5"/><circle cx="750" cy="206" r="11" fill="#c3d3d5"/>
  <path d="M222 206H729" stroke="#a9b9c0" stroke-width="5" marker-end="url(#arrowGrey)"/>
  <text x="205" y="242" text-anchor="middle" direction="rtl" font-family="Vazirmatn,Tahoma,sans-serif" font-size="16" fill="#d7e4e4">مصرف امروز</text>
  <text x="750" y="242" text-anchor="middle" direction="rtl" font-family="Vazirmatn,Tahoma,sans-serif" font-size="16" fill="#d7e4e4">مصرف محتمل</text>
  <text x="475" y="186" text-anchor="middle" direction="rtl" font-family="Vazirmatn,Tahoma,sans-serif" font-size="15" fill="#b5c7cc">اگر روندها ادامه یابند، چه می‌شود؟</text>
  <circle cx="750" cy="394" r="12" fill="#70e9ae"/><circle cx="205" cy="394" r="12" fill="#70e9ae"/>
  <path d="M733 394H226" stroke="#58e6ad" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <text x="750" y="431" text-anchor="middle" direction="rtl" font-family="Vazirmatn,Tahoma,sans-serif" font-size="16" fill="#b9f9d4">هدف ۱۴۱۰</text>
  <text x="205" y="431" text-anchor="middle" direction="rtl" font-family="Vazirmatn,Tahoma,sans-serif" font-size="16" fill="#b9f9d4">تصمیم امروز</text>
  <text x="475" y="374" text-anchor="middle" direction="rtl" font-family="Vazirmatn,Tahoma,sans-serif" font-size="15" fill="#c2f8da">برای رسیدن به هدف، چه باید از امروز آغاز شود؟</text>
  <text x="480" y="505" text-anchor="middle" direction="rtl" font-family="Vazirmatn,Tahoma,sans-serif" font-size="15" fill="#9cb8b1">پیش‌بینی وضع موجود را روشن می‌کند؛ پس‌نگری مسیر رسیدن به هدف را می‌سنجد.</text>
</svg>
