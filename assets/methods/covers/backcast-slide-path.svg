<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">بازگشت گام‌به‌گام از چشم‌انداز آینده به امروز</title><desc id="desc">پیکان سبز بزرگ از هدف آینده به اقدام امروز برمی‌گردد و مسیر اجرا دوباره رو به جلو آزموده می‌شود.</desc>
<defs><marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#80a624"/></marker><marker id="small" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#81909b"/></marker></defs>
<rect width="960" height="540" fill="white"/><text x="480" y="52" text-anchor="middle" font-family="Vazirmatn,Tahoma,sans-serif" font-size="30" font-weight="800" fill="#252a30">از آیندهٔ مطلوب به تصمیم امروز</text>
<path d="M790 133C660 56 375 80 165 372" fill="none" stroke="#7fa225" stroke-width="38" stroke-linecap="round" marker-end="url(#arrow)"/><text x="510" y="114" text-anchor="middle" font-family="Vazirmatn,Tahoma,sans-serif" font-size="17" font-weight="700" fill="#fff">چه چیزی باید پیش از هدف آماده باشد؟</text>
<path d="M152 431C320 372 545 351 805 316" fill="none" stroke="#d9dddf" stroke-width="44" stroke-linecap="round"/><path d="M163 431C320 372 545 351 796 317" fill="none" stroke="#8a969e" stroke-width="3" stroke-dasharray="12 12" marker-end="url(#small)"/>
<g fill="#fff" stroke="#6b7780" stroke-width="3"><circle cx="165" cy="427" r="13"/><circle cx="359" cy="377" r="13"/><circle cx="565" cy="346" r="13"/><circle cx="793" cy="317" r="13"/></g>
<g font-family="Vazirmatn,Tahoma,sans-serif" text-anchor="middle" direction="rtl" fill="#2d3740"><text x="165" y="480" font-size="21" font-weight="800">امروز</text><text x="359" y="430" font-size="18">مجوز و بودجه</text><text x="565" y="398" font-size="18">زیرساخت آماده</text><text x="793" y="369" font-size="21" font-weight="800">هدف آینده</text></g>
<rect x="660" y="180" width="230" height="78" rx="24" fill="#eaf3d2" stroke="#89aa3b"/><text x="775" y="210" text-anchor="middle" font-family="Vazirmatn,Tahoma,sans-serif" font-size="17" fill="#3d551a">هدف روشن و قابل سنجش</text><text x="775" y="239" text-anchor="middle" font-family="Vazirmatn,Tahoma,sans-serif" font-size="18" font-weight="800" fill="#3d551a">مثلاً کاهش ۶۰٪ انتشار</text>
<text x="480" y="519" text-anchor="middle" font-family="Vazirmatn,Tahoma,sans-serif" font-size="15" fill="#5b6670">پس از طراحی معکوس، شدنی بودن مسیر را از امروز به جلو بررسی کنید.</text>
</svg>
