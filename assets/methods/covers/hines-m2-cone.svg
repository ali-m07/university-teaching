<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="540">
      <stop stop-color="#070a13"/><stop offset="1" stop-color="#0f1729"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00e5ff"/><stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)" rx="18"/>
  <text x="480" y="46" text-anchor="middle" fill="#f3f4f6" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Cone of Plausibility</text>
  <text x="480" y="70" text-anchor="middle" fill="#8b9bb0" font-family="Segoe UI,Arial,sans-serif" font-size="12">Hines &amp; Bishop, Framework Foresight (2013)</text>

  <!-- preposterous outer boundary (unbounded, fading) -->
  <path d="M196 258 C430 190 660 130 890 76" stroke="#8b9bb0" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="4 6" fill="none"/>
  <path d="M196 282 C430 350 660 410 890 464" stroke="#8b9bb0" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="4 6" fill="none"/>
  <!-- possible boundary -->
  <path d="M196 261 C430 220 660 175 890 128" stroke="#7c4dff" stroke-width="2" fill="none"/>
  <path d="M196 279 C430 320 660 365 890 412" stroke="#7c4dff" stroke-width="2" fill="none"/>
  <!-- plausible boundary -->
  <path d="M196 264 C430 245 660 220 890 190" stroke="#00e5ff" stroke-width="2" fill="none"/>
  <path d="M196 276 C430 295 660 320 890 350" stroke="#00e5ff" stroke-width="2" fill="none"/>
  <!-- probable band (hugs the baseline) -->
  <path d="M196 267 C430 262 660 258 890 252" stroke="#f3f4f6" stroke-width="1.6" stroke-opacity="0.85" fill="none"/>
  <path d="M196 273 C430 278 660 282 890 288" stroke="#f3f4f6" stroke-width="1.6" stroke-opacity="0.85" fill="none"/>
  <!-- baseline (dotted center trajectory) -->
  <path d="M196 270 C430 270 660 270 890 270" stroke="#ffaa00" stroke-width="1.6" stroke-dasharray="2 5" fill="none"/>

  <circle cx="182" cy="270" r="12" fill="#f3f4f6"/>
  <text x="182" y="244" text-anchor="middle" fill="#f3f4f6" font-size="13" font-weight="600">Today</text>

  <text x="895" y="270" fill="#f3f4f6" font-size="12" font-weight="600">probable</text>
  <text x="895" y="185" fill="#00e5ff" font-size="12" font-weight="600">plausible</text>
  <text x="895" y="123" fill="#7c4dff" font-size="12" font-weight="600">possible</text>
  <text x="895" y="71" fill="#8b9bb0" font-size="12">preposterous</text>
  <text x="895" y="355" fill="#00e5ff" font-size="12" font-weight="600">plausible</text>
  <text x="895" y="417" fill="#7c4dff" font-size="12" font-weight="600">possible</text>
  <text x="895" y="469" fill="#8b9bb0" font-size="12">preposterous</text>

  <rect x="592" y="241" width="16" height="16" fill="#ffaa00"/>
  <text x="616" y="254" fill="#ffaa00" font-size="12">broken assumption to branch</text>

  <rect x="666" y="176" width="14" height="14" fill="#f3f4f6"/>
  <text x="688" y="187" fill="#f3f4f6" font-size="12">preferred future (chosen by visioning)</text>

  <text x="480" y="478" text-anchor="middle" fill="#8b9bb0" font-size="13">Baseline analysis breaks assumptions behind the baseline to grow plausible and possible branches.</text>
  <text x="480" y="500" text-anchor="middle" fill="#8b9bb0" font-size="13">Visioning selects a preferred image from inside the plausible and possible layers.</text>

  <text x="480" y="524" text-anchor="middle" fill="#8b9bb0" font-family="Segoe UI,Arial,sans-serif" font-size="13">Hines &amp; Bishop · Forecasting to Visioning · Module M2</text>
</svg>
