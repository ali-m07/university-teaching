<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="540">
      <stop stop-color="#070a13"/><stop offset="1" stop-color="#0f1729"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00e5ff"/><stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b9bb0"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)" rx="18"/>
  <text x="480" y="52" text-anchor="middle" fill="#f3f4f6" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">CLA on a Tech Case · GenAI &amp; Platforms</text>
  
  <rect x="90" y="110" width="360" height="330" rx="16" fill="#102030" stroke="#00e5ff" stroke-width="2"/>
  <text x="270" y="150" text-anchor="middle" fill="#00e5ff" font-size="18" font-weight="700">Litany → Systemic</text>
  <text x="270" y="185" text-anchor="middle" fill="#f3f4f6" font-size="13">"AI replaces jobs"</text>
  <text x="270" y="215" text-anchor="middle" fill="#8b9bb0" font-size="13">compute, cloud rents,</text>
  <text x="270" y="235" text-anchor="middle" fill="#8b9bb0" font-size="13">model ownership, data law</text>
  <line x1="120" y1="270" x2="420" y2="270" stroke="#8b9bb0" stroke-opacity="0.4"/>
  <text x="270" y="300" text-anchor="middle" fill="#f3f4f6" font-size="13">Platform power</text>
  <text x="270" y="325" text-anchor="middle" fill="#8b9bb0" font-size="13">who sets the rules of</text>
  <text x="270" y="345" text-anchor="middle" fill="#8b9bb0" font-size="13">the marketplace?</text>
  <rect x="510" y="110" width="360" height="330" rx="16" fill="#152035" stroke="#ff5a7a" stroke-width="2"/>
  <text x="690" y="150" text-anchor="middle" fill="#ff5a7a" font-size="18" font-weight="700">Worldview → Myth</text>
  <text x="690" y="190" text-anchor="middle" fill="#f3f4f6" font-size="13">"Neutral technology"</text>
  <text x="690" y="215" text-anchor="middle" fill="#8b9bb0" font-size="13">vs. "national AI race"</text>
  <line x1="540" y1="270" x2="840" y2="270" stroke="#8b9bb0" stroke-opacity="0.4"/>
  <text x="690" y="305" text-anchor="middle" fill="#ffaa00" font-size="14" font-weight="700">All-knowing machine</text>
  <text x="690" y="330" text-anchor="middle" fill="#8b9bb0" font-size="13">vs. co-worker tool</text>
  <path d="M450 275 H510" stroke="#8b9bb0" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="480" y="516" text-anchor="middle" fill="#8b9bb0" font-family="Segoe UI,Arial,sans-serif" font-size="14">Case: generative AI &amp; platforms · Module M2</text>
